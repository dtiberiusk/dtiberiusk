<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dtiberiusk</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <img src="/art/haroldscousin.jpeg" alt="Mr Harold's Cousin" class="top-image">
    <div class="titles">
      <h1>Hello world!</h1>
      <h2>So far just some tools and some art.</h2>
    </div>
  </header>

  <nav class="page-links">
    <a href="music/">Music</a>
    <a href="printer/">Printer</a>
    <a href="tools/Electrical%20Calculations.html">Electrical Calculations</a>
    <a href="tools/Margin%20and%20Cost.html">Revenue and Margin Calculator</a>
  </nav>

  <main class="gallery"></main>

  <nav class="page-links">
    <a href="tools/PDF%20Scroll%20Reader.html">PDF Scroller</a>
    <a href="tools/PDF%20Combiner.html">PDF Combiner</a>
    <a href="tools/UL%20Nema%20Enclosures.html">NEMA Enclosure Calculator</a>
  </nav>

  <footer>
    <p>That's that! </p>
    <a href="tools/starward.html">Race for Starward</a>
    <p> © 2026 dtiberiusk</p>
  </footer>

  <script>
  (function () {
    const gallery = document.querySelector('.gallery');
    if (!gallery) return;
    let imgs = [];

    function layout() {
      const ready = imgs.filter(i => i.naturalWidth);
      if (!ready.length) return;
      const border = parseFloat(getComputedStyle(ready[0]).borderLeftWidth) * 2;
      const gap = parseFloat(getComputedStyle(gallery).columnGap) || 0;
      const totalRatio = ready.reduce((s, i) => s + i.naturalWidth / i.naturalHeight, 0);
      const availW = gallery.clientWidth - gap * (ready.length - 1) - border * ready.length;
      const footer = document.querySelector('footer');
      const top = gallery.getBoundingClientRect().top;
      const bottom = footer ? footer.getBoundingClientRect().top : window.innerHeight;
      const availH = bottom - top - gap - border;
      const h = Math.max(50, Math.min(availW / totalRatio, availH));
      ready.forEach(i => {
        i.style.height = (h + border) + 'px';
        i.style.width = (h * i.naturalWidth / i.naturalHeight + border) + 'px';
      });
    }

    fetch('/art/', { headers: { Accept: 'application/json' } })
      .then(r => r.json())
      .then(files => {
        files
          .filter(f => (f.type === 'file' || f.is_dir === false) && /\.(jpe?g|png|webp|gif)$/i.test(f.name))
          .filter(f => f.name !== 'haroldscousin.jpeg')
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
          .forEach(f => {
            const img = document.createElement('img');
            img.src = '/art/' + encodeURIComponent(f.name);
            img.alt = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
            img.addEventListener('load', layout);
            gallery.appendChild(img);
            imgs.push(img);
          });
      });

    window.addEventListener('resize', layout);
  })();
  </script>
</body>
</html>
